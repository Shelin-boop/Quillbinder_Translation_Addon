# Builds the add-on against The Qt Company's Qt 6.12.0 (Quillbinder's runtime since 0.80.0), runs every check with
# the real models, and makes the package:
#  - a push to a work branch puts it on the pre-release "test" (a fixed address for trying it out),
#  - a push to main publishes the release v<version> (once per version).
name: Build

on:
  push:
    branches: ['**']
    paths-ignore: ['models/convert.py', '.github/workflows/models.yml', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"
  QT_DIR: /opt/qt/6.12.0/gcc_64

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libgl-dev libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            fonts-dejavu-core hunspell-en-us hunspell-en-gb hunspell-tools wordnet-base

      - name: Qt ${{ env.QT_VERSION }} (The Qt Company's build, as in Quillbinder's AppImage)
        run: |
          python3 -m pip install --user -q 'aqtinstall==3.3.0'
          sudo mkdir -p /opt/qt && sudo chown "$USER" /opt/qt
          python3 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O /opt/qt
          test -f "$QT_DIR/plugins/tls/libqopensslbackend.so"

      # restore and save on their own: the libraries are kept even when a later step fails
      - name: Engine libraries (cache)
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/install
            deps/CTranslate2
            deps/oneDNN
            deps/sentencepiece
          key: deps-${{ hashFiles('packaging/build-deps.sh') }}-ubuntu-24.04

      - name: Engine libraries (oneDNN, CTranslate2, SentencePiece)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          packaging/build-deps.sh
          rm -rf deps/b-onednn deps/b-ct2 deps/b-spm

      - name: Engine libraries (keep)
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps/install
            deps/CTranslate2
            deps/oneDNN
            deps/sentencepiece
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: The American spelling list is made from the dictionaries
        run: |
          python3 tools/make-us-spelling.py
          if ! git diff --quiet -- resources/us-spelling.tsv resources/en-words.txt; then
            echo "::warning::The dictionaries of this runner give another spelling list than the one in the source (newer Ubuntu packages?); the source's list is used."
            git diff --stat -- resources/
            git checkout -- resources/us-spelling.tsv resources/en-words.txt
          fi

      - name: The similar words are made from WordNet
        run: |
          python3 tools/make-thesaurus.py
          if ! git diff --quiet -- resources/en-thesaurus.tsv; then
            echo "::warning::WordNet of this runner gives another list of similar words than the one in the source; the source's list is used."
            git diff --stat -- resources/
            git checkout -- resources/en-thesaurus.tsv
          fi

      - name: Models for the checks (cache)
        id: models
        uses: actions/cache/restore@v4
        with:
          path: models-cache
          key: models-${{ hashFiles('resources/catalog.json') }}

      - name: Models for the checks (download)
        if: steps.models.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # 1.1: the models of 1.0 (models-1) and of models-2 the ones the checks use: Qwen3 1.7B, the larger
        # translator, and the 4B model's tokenizer (its model file is 4 GB and is not run in the checks)
        run: |
          gh release download models-1 -R "${{ github.repository }}" -D models-cache
          gh release download models-2 -R "${{ github.repository }}" -D models-cache --clobber \
            -p 'catalog.json' -p 'qwen3-1.7b--*' -p 'opus-mt-big-de-en--*' -p 'qwen3-4b--tokenizer*' -p 'qwen3-4b--vocabulary.json'
          ls -la models-cache

      - name: Models for the checks (keep)
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: models-cache
          key: ${{ steps.models.outputs.cache-primary-key }}

      - name: Build with the checks
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="$QT_DIR" -DTP_TEST_SWITCHES=ON
          cmake --build build

      - name: Checks
        env:
          QT_QPA_PLATFORM: offscreen
          TP_MODELS_DIR: ${{ github.workspace }}/models-cache
          TP_SHOTS: ${{ github.workspace }}/screenshots
        run: |
          cd build
          ctest --output-on-failure --timeout 3600

      - name: Release build and package
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_PREFIX_PATH="$QT_DIR" -DTP_TEST_SWITCHES=OFF
          cmake --build build-release
          tests/check-exports.sh build-release
          QB_QT_DIR="$QT_DIR" packaging/make-addon.sh build-release dist
          sha256sum dist/*.qbpkg | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: translation-proofreading
          path: |
            dist/
            screenshots/

      - name: Test build on the pre-release "test"
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test --yes --cleanup-tag 2>/dev/null || true
          gh release create test --prerelease --target "${{ github.sha }}" \
            --title "Test build (not a release)" \
            --notes "Built from the branch ${{ github.ref_name }}, commit ${{ github.sha }}. For trying out: install with Quillbinder's File > Install Update or Add-on, then restart Quillbinder. Replaced by every new test build." \
            dist/*.qbpkg dist/SHA256SUMS.txt

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import json; print(json.load(open('packaging/manifest.json'))['version'])")
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V is published already (raise the version for a new release)"
            exit 0
          fi
          python3 - "$V" > notes.md <<'PY'
          import json, sys
          m = json.load(open("packaging/manifest.json"))
          print("Install with Quillbinder's **File > Install Update or Add-on** (Quillbinder 0.80.0 or later, Linux), "
                "then restart Quillbinder. The models are chosen and downloaded in **File > Options > Proofreading**.\n")
          print("What is new:\n")
          for line in m["whatsNew"]:
              print(f"- {line}")
          PY
          gh release create "v$V" --title "Translation and Proofreading $V" --notes-file notes.md \
            dist/*.qbpkg dist/SHA256SUMS.txt

  # Windows 11 x64 (2026-11-16): the same add-on for Quillbinder for Windows, built with MSVC against The Qt Company's
  # Qt 6.12.0 for MSVC 2022 (Quillbinder's Windows runtime), its checks with the real models in a folder named with
  # letters outside ASCII (as C:\Users\Jürgen\...), the package translation-proofreading-<version>-windows.qbpkg:
  # a work branch puts it on the pre-release "test-windows", main publishes "v<version>-windows" once.
  windows:
    runs-on: windows-2025
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Qt cache
        id: qtcache
        uses: actions/cache@v4
        with:
          path: C:\Qt\6.12.0
          key: qt-6.12.0-win64_msvc2022_64-v1

      # aqtinstall 3.3.0 looks for the Windows packages of Qt 6.11 and later in the wrong folder; the step gives it the
      # folder name first (the same patch as Quillbinder's public Windows workflow)
      - name: Qt ${{ env.QT_VERSION }} for MSVC 2022 (The Qt Company's build, as in Quillbinder for Windows)
        run: |
          if [ "${{ steps.qtcache.outputs.cache-hit }}" != "true" ]; then
            python -m pip install -q 'aqtinstall==3.3.0'
            python - <<'PY'
          import pathlib
          import aqt.metadata as m
          p = pathlib.Path(m.__file__)
          s = p.read_text(encoding="utf-8")
          old = "    def extension_for_arch(architecture: str, is_version_ge_6: bool) -> str:\n"
          new = old + ("        if architecture.startswith('win64_') and is_version_ge_6:\n"
                       "            return architecture[len('win64_'):]\n")
          assert old in s, "aqtinstall changed: extension_for_arch not found"
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
            python -m aqt install-qt windows desktop "$QT_VERSION" win64_msvc2022_64 -O C:/Qt
          fi
          test -f /c/Qt/6.12.0/msvc2022_64/bin/Qt6Core.dll

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          "VSDIR=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Engine libraries (cache)
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/install
            deps/CTranslate2
            deps/oneDNN
            deps/sentencepiece
          key: deps-${{ hashFiles('packaging/build-deps-windows.sh') }}-windows-2025

      - name: Engine libraries (oneDNN, CTranslate2, SentencePiece with MSVC)
        if: steps.deps.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          "C:\Program Files\Git\bin\bash.exe" -c "packaging/build-deps-windows.sh > deps-build.log 2>&1; rc=$?; tail -40 deps-build.log; rm -rf deps/b-onednn deps/b-ct2 deps/b-spm; exit $rc"

      - name: Engine libraries (keep)
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps/install
            deps/CTranslate2
            deps/oneDNN
            deps/sentencepiece
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Models for the checks (cache)
        id: models
        uses: actions/cache/restore@v4
        with:
          path: models-cache
          key: models-${{ hashFiles('resources/catalog.json') }}-windows

      - name: Models for the checks (download)
        if: ${{ !cancelled() && steps.models.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download models-1 -R "${{ github.repository }}" -D models-cache
          gh release download models-2 -R "${{ github.repository }}" -D models-cache --clobber \
            -p 'catalog.json' -p 'qwen3-1.7b--*' -p 'opus-mt-big-de-en--*' -p 'qwen3-4b--tokenizer*' -p 'qwen3-4b--vocabulary.json'
          ls -la models-cache

      - name: Models for the checks (keep)
        if: ${{ !cancelled() && steps.models.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: models-cache
          key: ${{ steps.models.outputs.cache-primary-key }}

      # (also when the engine libraries failed: the add-on's own code is compiled all the same, so its faults show in the
      # same run)
      - name: Build with the checks
        id: build
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=C:/Qt/6.12.0/msvc2022_64 -DTP_TEST_SWITCHES=ON || exit /b 1
          cmake --build build || exit /b 1

      # the checks' data in a folder named with letters outside ASCII (QTemporaryDir takes TEMP), so the model paths are
      # too; dumpbin (the exports check) needs MSVC's environment
      - name: A temporary folder named with letters outside ASCII
        if: ${{ !cancelled() }}
        run: mkdir -p "$RUNNER_TEMP/Prüfung Jürgen ß"

      # (since the fourth run: every later step runs even when one fails, and the checks print their whole output, so
      # that one run shows every fault)
      - name: Checks
        id: checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
          TP_MODELS_DIR: ${{ github.workspace }}\models-cache
          TP_SHOTS: ${{ github.workspace }}\screenshots
          TEMP: ${{ runner.temp }}\Prüfung Jürgen ß
          TMP: ${{ runner.temp }}\Prüfung Jürgen ß
        run: |
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "PATH=C:\Qt\6.12.0\msvc2022_64\bin;%PATH%"
          cd build
          ctest --output-on-failure --timeout 3600
          set rc=%ERRORLEVEL%
          for %%f in (test-*.txt) do (
            echo ===== %%f
            type "%%f"
          )
          if not "%rc%"=="0" type Testing\Temporary\LastTest.log
          exit /b %rc%

      - name: Release build and package
        if: ${{ !cancelled() && (success() || steps.checks.outcome == 'failure') }}
        shell: cmd
        run: |
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build-release -G Ninja -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=C:/Qt/6.12.0/msvc2022_64 -DTP_TEST_SWITCHES=OFF || exit /b 1
          cmake --build build-release || exit /b 1
          "C:\Program Files\Git\bin\bash.exe" -c "tests/check-exports-windows.sh build-release && packaging/make-addon-windows.sh build-release dist && sha256sum dist/*.qbpkg | tee dist/SHA256SUMS-windows.txt" || exit /b 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-proofreading-windows
          path: |
            dist/
            screenshots/
            deps-build.log
          if-no-files-found: ignore

      - name: Test build on the pre-release "test-windows"
        if: success() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-windows --yes --cleanup-tag 2>/dev/null || true
          gh release create test-windows --prerelease --target "${{ github.sha }}" \
            --title "Test build for Windows (not a release)" \
            --notes "Built from the branch ${{ github.ref_name }}, commit ${{ github.sha }}, for Quillbinder for Windows 0.91.1 or later. For trying out: install with Quillbinder's File > Install Update or Add-on, then restart Quillbinder. Replaced by every new test build." \
            dist/*.qbpkg dist/SHA256SUMS-windows.txt

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import json; print(json.load(open('packaging/manifest.json'))['version'])")
          if gh release view "v$V-windows" >/dev/null 2>&1; then
            echo "v$V-windows is published already (raise the version for a new release)"
            exit 0
          fi
          python - "$V" > notes.md <<'PY'
          import json, sys
          m = json.load(open("packaging/manifest.json"))
          print("For Quillbinder for Windows (0.91.1 or later): install with **File > Install Update or Add-on**, then "
                "restart Quillbinder. The models are chosen and downloaded in **File > Options > Proofreading**.\n")
          print("What is new:\n")
          for line in m["whatsNew"]:
              print(f"- {line}")
          PY
          gh release create "v$V-windows" --latest=false --title "Translation and Proofreading $V for Windows" --notes-file notes.md \
            dist/*.qbpkg dist/SHA256SUMS-windows.txt

  # Android (2026-11-16): the same add-on for Quillbinder for Android (not published yet; its version 0.91.3 is the
  # first that installs add-ons), built with the Android NDK r27c against The Qt Company's Qt 6.12.0 for Android
  # (Quillbinder for Android's runtime, "android-qt6.12-r1"), for tablets (arm64-v8a) and for the emulated tablets of
  # Quillbinder's checks (x86_64). The engine computes with Ruy instead of oneDNN. The checks of the logic run in the
  # Linux job (the same code); here: the libraries' symbols, what they need, their 16 KB pages. A work branch puts the
  # packages on the pre-release "test-android"; main publishes nothing for Android until Quillbinder for Android is
  # published.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NDK_VERSION: "27.2.12479018"
      QT_BASE: /opt/qt
    steps:
      - uses: actions/checkout@v4

      - name: The Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          sudo apt-get install -y -q ninja-build > /dev/null

      - name: Qt cache
        id: qtcache
        uses: actions/cache@v4
        with:
          path: /opt/qt
          key: qt-${{ env.QT_VERSION }}-android-arm64-x86_64-v1

      - name: Qt ${{ env.QT_VERSION }} for Android and for the build machine (The Qt Company's build)
        if: steps.qtcache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --user -q 'aqtinstall==3.3.0'
          sudo mkdir -p /opt/qt && sudo chown "$USER" /opt/qt
          python3 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O /opt/qt
          for arch in android_arm64_v8a android_x86_64; do
            python3 -m aqt install-qt all_os android "$QT_VERSION" "$arch" -O /opt/qt
          done
          rm -rf /opt/qt/"$QT_VERSION"/*/doc /opt/qt/"$QT_VERSION"/*/examples

      - name: Engine libraries for Android (cache)
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            deps-android/arm64-v8a/install
            deps-android/x86_64/install
            deps/CTranslate2
            deps/sentencepiece
          key: deps-android-${{ hashFiles('packaging/build-deps-android.sh') }}-ndk-${{ env.NDK_VERSION }}

      - name: Engine libraries for Android (CTranslate2 with Ruy, SentencePiece)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          for abi in arm64-v8a x86_64; do
            packaging/build-deps-android.sh "$NDK" "$abi" 2>&1 | tail -40
            rm -rf "deps-android/$abi/b-ct2" "deps-android/$abi/b-spm"
          done

      - name: Engine libraries for Android (keep)
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps-android/arm64-v8a/install
            deps-android/x86_64/install
            deps/CTranslate2
            deps/sentencepiece
          key: deps-android-${{ hashFiles('packaging/build-deps-android.sh') }}-ndk-${{ env.NDK_VERSION }}

      - name: Release builds, checks of the libraries and packages
        id: build
        run: |
          set -o pipefail
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          fail=0
          for abi in arm64-v8a x86_64; do
            arch=android_${abi//-/_}
            Q="$QT_BASE/$QT_VERSION/$arch"
            B="build-android-$abi"
            echo "::group::$abi"
            cmake -S . -B "$B" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$Q/lib/cmake/Qt6/qt.toolchain.cmake" -DQT_HOST_PATH="$QT_BASE/$QT_VERSION/gcc_64" \
              -DANDROID_SDK_ROOT="$ANDROID_HOME" -DANDROID_NDK_ROOT="$NDK" \
              -DTP_DEPS_DIR="$PWD/deps-android/$abi/install" -DTP_TEST_SWITCHES=OFF 2>&1 | tail -15
            cmake --build "$B" 2>&1 | tail -30
            echo "::endgroup::"
            NM="$BIN/llvm-nm" tests/check-exports.sh "$B" || fail=1
            for lib in "$B/addon/plugins/libqb-translation-proofreading.so" "$B/addon/translation-proofreading/libqb-tp-engine.so"; do
              name=$(basename "$lib")
              # what Android must find for it: only the system's, the C++ library and Qt's, all loaded by the app
              needed=$("$BIN/llvm-readelf" -d "$lib" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | tr '\n' ' ')
              other=$(echo "$needed" | tr ' ' '\n' | grep -v -E '^(libc|libm|libdl|liblog|libc\+\+_shared)\.so$|^libQt6[A-Za-z]+_'"$abi"'\.so$|^$' || true)
              if [ -n "$other" ]; then echo "FAIL: $abi $name needs $other"; fail=1; else echo "ok: $abi $name needs $needed"; fi
              # 16 KB pages: every LOAD segment aligned to at least 0x4000
              small=""
              for a in $("$BIN/llvm-readelf" -l "$lib" | awk '$1 == "LOAD" { print $NF }'); do
                [ $((a)) -lt 16384 ] && small=$a
              done
              if [ -n "$small" ]; then echo "FAIL: $abi $name has a LOAD segment aligned to $small"; fail=1; else echo "ok: $abi $name 16 KB pages"; fi
            done
            packaging/make-addon-android.sh "$B" dist "$abi" "$NDK" || fail=1
          done
          (cd dist && sha256sum ./*.qbpkg | sed 's# \./# #' | tee SHA256SUMS-android.txt)
          exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-proofreading-android
          path: dist/
          if-no-files-found: ignore

      - name: Test build on the pre-release "test-android"
        if: success() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-android --yes --cleanup-tag 2>/dev/null || true
          gh release create test-android --prerelease --latest=false --target "${{ github.sha }}" \
            --title "Test build for Android (not a release)" \
            --notes "Built from the branch ${{ github.ref_name }}, commit ${{ github.sha }}, for Quillbinder for Android 0.91.3 or later (not published yet): the arm64 package for tablets, the x86_64 package for emulated tablets. Install with Quillbinder's File > Install Update or Add-on. Replaced by every new test build." \
            dist/*.qbpkg dist/SHA256SUMS-android.txt
